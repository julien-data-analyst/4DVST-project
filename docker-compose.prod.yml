
services:

  # ─────────────────────────────────────────
  # PostgreSQL — base de données partagée
  # (utilisée par dbt ET Metabase)
  # ─────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4 # extension for using geom function
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-datawarehouse}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d   # scripts SQL exécutés au premier démarrage
      - ./postgres/metabase.dump:/docker-entrypoint-initdb.d/metabase.dump:ro # Sauvegarde de la base de données Metabase (pour pré-remplir les dashboards, questions, etc.)
      - ./postgres/restore.sh:/docker-entrypoint-initdb.d/restore.sh:ro # Script de restauration de la base de données (exécuté à chaque démarrage pour écraser les données avec celles de metabase.dump)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-datawarehouse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data_network

  # ─────────────────────────────────────────
  # Metabase — BI & dashboards
  # ─────────────────────────────────────────
  metabase:
    build: 
      context: ./metabase
    container_name: metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Base de données interne de Metabase (stocke sources, dashboards, questions)
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB:-metabase}
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-admin}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-admin}
      MB_DB_HOST: postgres
      # Options générales
      MB_SITE_URL: http://localhost:3000
      JAVA_TIMEZONE: Europe/Paris
      MB_ENCRYPTION_SECRET_KEY: ${MB_ENCRYPTION_SECRET_KEY:-changeme_secret_32chars_minimum!!}
    volumes:
      # Plugins / drivers additionnels (.jar) → monté dans le dossier plugins officiel
      - ./metabase/resources:/plugins
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # curl est disponible dans l'image officielle Metabase
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s   # l'image officielle démarre plus lentement que le JAR nu
    networks:
      - data_network

  # ─────────────────────────────────────────
  # DBT — transformation de données
  # ─────────────────────────────────────────
  dbt-prod:
    build:
      context: ./dbt-dev
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}

    container_name: dbt-prod

    environment:
      DBT_PROFILES_DIR: /app/meteo

    env_file:
      - .env

    volumes:
      - ./dbt-dev/meteo:/app/meteo

    working_dir: /app/meteo
    command: ["dbt", "run"]

    depends_on:
      python-extract-prod:
        condition: service_completed_successfully

    networks:
      - data_network
      
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────
  # Python Extract — extraction de données (ex: scripts d'extraction GeoJSON/CSV)
  # ─────────────────────────────────────────
  python-extract-prod:
    build:
      context: ./extract-data
    container_name: python-extract-prod
    env_file:
      - .env
    volumes:
      - ./data:/data
    working_dir: /app/scripts
    command: ["python", "main.py"]

    restart: "no"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - data_network

# ─────────────────────────────────────────
# Volumes nommés (données persistantes)
# ─────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

# ─────────────────────────────────────────
# Réseau interne
# ─────────────────────────────────────────
networks:
  data_network:
    driver: bridge
